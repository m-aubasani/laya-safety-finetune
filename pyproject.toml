[project]
name = "laya-safety-finetune"
version = "0.1.0"
description = "Laya RLCD fine-tuning pipeline (ModernBERT-large + decision head, strictly proper scoring)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "numpy>=2.5.3",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laya_rlcd"]
